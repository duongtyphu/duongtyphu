<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập — VDAI Academy</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="assets/css/styles.css?v=20260620e">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #F8FAFC 0%, #EEF4FF 100%);
      padding: 24px;
    }
    .auth-card {
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(15,23,42,0.12);
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
    }
    .auth-logo {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none; margin-bottom: 32px;
    }
    .auth-logo-mark {
      width: 40px; height: 40px; border-radius: 10px;
      background: linear-gradient(135deg, #2563EB, #6D5DFB);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 900; font-size: 1rem;
    }
    .auth-logo-text { font-weight: 800; font-size: 1.1rem; color: #0F172A; }
    .auth-logo-text span { color: #2563EB; }
    .auth-title { font-size: 1.5rem; font-weight: 800; color: #0F172A; margin-bottom: 6px; }
    .auth-sub { font-size: 0.9rem; color: #64748B; margin-bottom: 28px; }
    .auth-field { margin-bottom: 16px; }
    .auth-field label { display: block; font-size: 0.875rem; font-weight: 600; color: #334155; margin-bottom: 6px; }
    .auth-field input {
      width: 100%; padding: 12px 14px; border: 1.5px solid #E2E8F0;
      border-radius: 10px; font-size: 1rem; color: #0F172A;
      transition: border-color 0.2s; outline: none; font-family: inherit;
    }
    .auth-field input:focus { border-color: #2563EB; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    .auth-btn {
      width: 100%; padding: 14px; border: none; border-radius: 10px;
      background: linear-gradient(135deg, #2563EB, #1D4ED8);
      color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer;
      margin-top: 8px; transition: opacity 0.2s, transform 0.2s;
      font-family: inherit;
    }
    .auth-btn:hover { opacity: 0.92; transform: translateY(-1px); }
    .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .auth-divider { text-align: center; color: #94A3B8; font-size: 0.85rem; margin: 20px 0; }
    .auth-switch { text-align: center; font-size: 0.875rem; color: #475569; margin-top: 20px; }
    .auth-switch a { color: #2563EB; font-weight: 600; text-decoration: none; }
    .auth-switch a:hover { color: #1D4ED8; }
    .auth-msg { padding: 12px 14px; border-radius: 10px; font-size: 0.875rem; margin-bottom: 16px; display: none; }
    .auth-msg.error { background: #FEF2F2; color: #DC2626; border: 1px solid #FECACA; display: block; }
    .auth-msg.success { background: #F0FDF4; color: #15803D; border: 1px solid #BBF7D0; display: block; }
    .auth-back { display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; color: #64748B; text-decoration: none; margin-bottom: 20px; }
    .auth-back:hover { color: #2563EB; }
    @media (max-width: 480px) {
      .auth-card { padding: 32px 20px; }
    }
  </style>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <a href="index.html" class="auth-back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      Về trang chủ
    </a>
    <a href="index.html" class="auth-logo" style="display:inline-flex;align-items:center;text-decoration:none">
      <svg width="48" height="48" viewBox="0 0 32 32" fill="none" style="display:inline-block;flex-shrink:0"><path d="M3 5L16 28L29 5H23L16 18L9 5Z" fill="#2563EB"/><circle cx="27" cy="7.5" r="3" fill="#F97316"/></svg><span style="display:inline-flex;flex-direction:column;line-height:1;margin-left:10px"><b style="font-size:22px;font-weight:800;color:#fff;letter-spacing:2px;font-family:Inter,system-ui,sans-serif">VDAI</b><small style="font-size:10px;font-weight:600;color:#94a3b8;letter-spacing:4px;font-family:Inter,system-ui,sans-serif">ACADEMY</small></span>
    </a>
    <h1 class="auth-title">Đăng nhập</h1>
    <p class="auth-sub">Chào mừng trở lại — vào trang tài liệu của bạn</p>

    <!-- Google OAuth -->
    <button type="button" id="googleBtn" style="width:100%;padding:12px;border:1.5px solid #E2E8F0;border-radius:10px;background:#fff;font-size:0.95rem;font-weight:600;color:#0F172A;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;font-family:inherit;transition:all 0.2s;margin-bottom:16px">
      <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 7.9 2.9l5.7-5.7C34.5 6.5 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19.1 12 24 12c3.1 0 5.8 1.1 7.9 2.9l5.7-5.7C34.5 6.5 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-1.9 13.5-5.1l-6.2-5.2C29.4 35.5 26.8 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.6 39.5 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.3 5.6l6.2 5.2C42 35.8 44 30.3 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
      Đăng nhập bằng Google
    </button>

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <div style="flex:1;height:1px;background:#E2E8F0"></div>
      <span style="font-size:0.78rem;color:#94A3B8;font-weight:600">HOẶC</span>
      <div style="flex:1;height:1px;background:#E2E8F0"></div>
    </div>

    <div class="auth-msg" id="authMsg"></div>

    <form id="loginForm">
      <div class="auth-field">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" placeholder="email@example.com" required autocomplete="email">
      </div>
      <div class="auth-field">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <label for="loginPassword" style="margin-bottom:0">Mật khẩu</label>
          <a href="#" id="forgotLink" style="font-size:0.8rem;color:#2563EB;text-decoration:none;font-weight:600">Quên mật khẩu?</a>
        </div>
        <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="auth-btn" id="loginBtn">Đăng nhập</button>
    </form>

    <div class="auth-switch" id="registerSwitch">
      Chưa có tài khoản? <a href="register.html">Đăng ký miễn phí</a>
    </div>

    <!-- Form quên mật khẩu — chỉ hiện khi bấm "Quên mật khẩu?", yêu cầu nhập email rồi mới gửi -->
    <form id="forgotForm" style="display:none">
      <p class="auth-sub" style="margin-bottom:20px">Nhập email tài khoản của bạn, chúng tôi sẽ gửi link đặt lại mật khẩu.</p>
      <div class="auth-field">
        <label for="forgotEmail">Email</label>
        <input type="email" id="forgotEmail" placeholder="email@example.com" required autocomplete="email">
      </div>
      <button type="submit" class="auth-btn" id="forgotSubmitBtn">Gửi email đặt lại mật khẩu</button>
      <div class="auth-switch" style="margin-top:16px">
        <a href="#" id="backToLoginLink">← Quay lại đăng nhập</a>
      </div>
    </form>

    <!-- Form đặt lại mật khẩu mới — chỉ hiện khi vào từ link "Quên mật khẩu" trong email -->
    <form id="resetForm" style="display:none">
      <p class="auth-sub" style="margin-bottom:20px">Nhập mật khẩu mới cho tài khoản của bạn.</p>
      <div class="auth-field">
        <label for="resetPassword">Mật khẩu mới</label>
        <input type="password" id="resetPassword" placeholder="••••••••" required autocomplete="new-password" minlength="6">
      </div>
      <div class="auth-field">
        <label for="resetPasswordConfirm">Xác nhận mật khẩu mới</label>
        <input type="password" id="resetPasswordConfirm" placeholder="••••••••" required autocomplete="new-password" minlength="6">
      </div>
      <button type="submit" class="auth-btn" id="resetBtn">Đặt lại mật khẩu</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/js/supabase-config.js"></script>
<script>
(async () => {
  const msg = document.getElementById('authMsg');

  // Link "Quên mật khẩu" trong email trả về URL có #access_token=...&type=recovery
  // → Supabase tự tạo session tạm. Phải xử lý TRƯỚC khi kiểm tra "đã đăng nhập",
  // nếu không sẽ bị chuyển hướng thẳng vào portal mà không cho đặt mật khẩu mới.
  const isRecovery = window.location.hash.includes('type=recovery');

  if (isRecovery) {
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('registerSwitch').style.display = 'none';
    const resetForm = document.getElementById('resetForm');
    resetForm.style.display = 'block';

    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const pass1 = document.getElementById('resetPassword').value;
      const pass2 = document.getElementById('resetPasswordConfirm').value;
      const resetBtn = document.getElementById('resetBtn');

      if (pass1 !== pass2) {
        msg.className = 'auth-msg error';
        msg.textContent = 'Hai mật khẩu không khớp nhau.';
        return;
      }
      if (pass1.length < 6) {
        msg.className = 'auth-msg error';
        msg.textContent = 'Mật khẩu cần tối thiểu 6 ký tự.';
        return;
      }

      resetBtn.disabled = true;
      resetBtn.textContent = 'Đang cập nhật...';
      const { error } = await _supabase.auth.updateUser({ password: pass1 });

      if (error) {
        msg.className = 'auth-msg error';
        msg.textContent = 'Lỗi: ' + error.message;
        resetBtn.disabled = false;
        resetBtn.textContent = 'Đặt lại mật khẩu';
      } else {
        msg.className = 'auth-msg success';
        msg.textContent = 'Đặt lại mật khẩu thành công! Đang chuyển vào portal...';
        setTimeout(() => { window.location.href = '/portal.html'; }, 1000);
      }
    });

    return;
  }

  // Nếu đã đăng nhập (và không phải đang trong luồng reset) → chuyển thẳng vào portal
  const session = await getSession();
  if (session) {
    const next = new URLSearchParams(window.location.search).get('next') || '/portal.html';
    window.location.href = next;
    return;
  }

  const form    = document.getElementById('loginForm');
  const btn     = document.getElementById('loginBtn');

  // Google OAuth
  document.getElementById('googleBtn').addEventListener('click', async () => {
    const { error } = await _supabase.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: SITE_URL + '/portal.html' }
    });
    if (error) {
      msg.className = 'auth-msg error';
      msg.textContent = 'Lỗi đăng nhập Google: ' + error.message;
    }
  });

  // Quên mật khẩu — bấm link sẽ chuyển sang form riêng yêu cầu nhập email rồi mới gửi
  const forgotForm = document.getElementById('forgotForm');
  const forgotEmailInput = document.getElementById('forgotEmail');

  document.getElementById('forgotLink').addEventListener('click', (e) => {
    e.preventDefault();
    msg.className = 'auth-msg';
    forgotEmailInput.value = document.getElementById('loginEmail').value.trim();
    form.style.display = 'none';
    document.getElementById('registerSwitch').style.display = 'none';
    forgotForm.style.display = 'block';
  });

  document.getElementById('backToLoginLink').addEventListener('click', (e) => {
    e.preventDefault();
    msg.className = 'auth-msg';
    forgotForm.style.display = 'none';
    form.style.display = 'block';
    document.getElementById('registerSwitch').style.display = 'block';
  });

  forgotForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = forgotEmailInput.value.trim();
    const forgotSubmitBtn = document.getElementById('forgotSubmitBtn');

    forgotSubmitBtn.disabled = true;
    forgotSubmitBtn.textContent = 'Đang gửi...';

    const { error } = await _supabase.auth.resetPasswordForEmail(email, {
      redirectTo: SITE_URL + '/login.html'
    });

    forgotSubmitBtn.disabled = false;
    forgotSubmitBtn.textContent = 'Gửi email đặt lại mật khẩu';

    if (error) {
      msg.className = 'auth-msg error';
      msg.textContent = 'Lỗi: ' + error.message;
    } else {
      msg.className = 'auth-msg success';
      msg.textContent = 'Đã gửi email đặt lại mật khẩu! Kiểm tra hộp thư của bạn.';
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = 'Đang đăng nhập...';
    msg.className = 'auth-msg';

    const email    = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;

    const { error } = await signIn(email, password);
    if (error) {
      msg.className = 'auth-msg error';
      msg.textContent = error.message === 'Invalid login credentials'
        ? 'Email hoặc mật khẩu không đúng.' : error.message;
      btn.disabled = false;
      btn.textContent = 'Đăng nhập';
    } else {
      msg.className = 'auth-msg success';
      msg.textContent = 'Đăng nhập thành công! Đang chuyển hướng...';
      setTimeout(() => {
        const next = new URLSearchParams(window.location.search).get('next') || 'portal.html';
        window.location.href = next;
      }, 800);
    }
  });
})();
</script>
</body>
</html>
