    <ellipse class="living-core__orbit living-core__orbit--2" cx="50" cy="51" rx="47" ry="39" stroke="#38D5FF" stroke-opacity="0.9" stroke-width="1.1" />
    <ellipse class="living-core__orbit living-core__orbit--3" cx="50" cy="51" rx="57" ry="47" stroke="#8B7DFF" stroke-opacity="0.8" stroke-width="0.9" />
