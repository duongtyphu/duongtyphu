      <circle class="living-core__mote" style="animation-delay:0.35s;animation-duration:3.60s" cx="22" cy="40" r="0.8" fill="#EAF4FF" />
      <circle class="living-core__mote" style="animation-delay:0.70s;animation-duration:4.00s" cx="76" cy="50" r="0.8" fill="#EAF4FF" />
      <circle class="living-core__mote" style="animation-delay:1.05s;animation-duration:4.40s" cx="40" cy="74" r="0.8" fill="#EAF4FF" />
      <circle class="living-core__mote" style="animation-delay:1.40s;animation-duration:4.80s" cx="64" cy="68" r="0.8" fill="#EAF4FF" />
      <circle class="living-core__mote" style="animation-delay:1.75s;animation-duration:5.20s" cx="20" cy="52" r="0.7" fill="#EAF4FF" />
