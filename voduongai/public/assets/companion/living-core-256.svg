      <circle class="living-core__mote" style="animation-delay:0.00s;animation-duration:4.00s" cx="34" cy="22" r="0.7" fill="#EAF4FF" />
      <circle class="living-core__mote" style="animation-delay:0.35s;animation-duration:4.40s" cx="72" cy="62" r="0.7" fill="#EAF4FF" />
      <circle class="living-core__mote" style="animation-delay:0.70s;animation-duration:4.80s" cx="26" cy="66" r="0.7" fill="#EAF4FF" />
      <circle class="living-core__mote" style="animation-delay:1.05s;animation-duration:5.20s" cx="46" cy="28" r="1.2" fill="#FFE082" />
      <circle class="living-core__mote" style="animation-delay:1.40s;animation-duration:3.60s" cx="64" cy="40" r="0.9" fill="#FFE082" />
      <circle class="living-core__mote" style="animation-delay:1.75s;animation-duration:4.00s" cx="38" cy="60" r="0.9" fill="#FFE082" />
    </g>
