<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 100 100" fill="none" role="img" aria-label="Companion Living Core">
  <title>Companion Living Core™</title>
  <defs>
    <radialGradient id="lc-body-64" cx="47%" cy="46%" r="68%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="14%" stop-color="#BFEAFF" stop-opacity="1" />
      <stop offset="32%" stop-color="#38D5FF" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#4F7DFF" stop-opacity="0.75" />
      <stop offset="78%" stop-color="#4F7DFF" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#4F7DFF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="lc-aura-64" cx="47%" cy="46%" r="62%">
      <stop offset="0%" stop-color="rgba(180,220,255,0.5)" />
      <stop offset="55%" stop-color="rgba(120,190,255,0.22)" />
      <stop offset="100%" stop-color="rgba(120,190,255,0)" />
    </radialGradient>
    <radialGradient id="lc-core-64" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </radialGradient>
    <clipPath id="lc-clip-64">
      <ellipse cx="50" cy="51" rx="34" ry="32" />
    </clipPath>
    <filter id="lc-blur-64" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2.4" /></filter>
    <filter id="lc-body-64-blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.6" /></filter>
    <style>
      .living-core__aura { transform-box: fill-box; transform-origin: center; mix-blend-mode: screen; animation: lc-aura-breathe 6s ease-in-out infinite; }
      @keyframes lc-aura-breathe { 0%, 100% { opacity: 0.8; transform: scale(1); } 50% { opacity: 1; transform: scale(1.045); } }
      .living-core__body { transform-box: fill-box; transform-origin: center; mix-blend-mode: screen; animation: lc-pulse 5s ease-in-out infinite; }
      @keyframes lc-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
      .living-core__core-glow { transform-box: fill-box; transform-origin: center; animation: lc-inner-glow 5s ease-in-out infinite; }
      .living-core__core { transform-box: fill-box; transform-origin: center; animation: lc-pulse 5s ease-in-out infinite; }
      @keyframes lc-inner-glow { 0%, 100% { opacity: 0.55; transform: scale(1); } 50% { opacity: 0.85; transform: scale(1.12); } }
      .living-core__orbit { transform-box: fill-box; transform-origin: center; }
      .living-core__orbit--1 { animation: lc-orbit-1-spin 42s linear infinite; }
      .living-core__orbit--2 { animation: lc-orbit-2-spin 58s linear infinite reverse; }
      @keyframes lc-orbit-1-spin { from { transform: rotate(-22deg); } to { transform: rotate(338deg); } }
      @keyframes lc-orbit-2-spin { from { transform: rotate(26deg); } to { transform: rotate(386deg); } }
      .living-core__mote { transform-box: fill-box; transform-origin: center; animation-name: lc-mote-twinkle; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
      @keyframes lc-mote-twinkle { 0%, 100% { opacity: 0.2; transform: scale(0.7); } 50% { opacity: 1; transform: scale(1.25); } }
      @media (prefers-reduced-motion: reduce) {
        .living-core__aura, .living-core__body, .living-core__core, .living-core__core-glow, .living-core__orbit, .living-core__mote { animation: none !important; }
      }
    </style>
  </defs>
  <g transform="rotate(-14 50 51)">
    <ellipse class="living-core__aura" cx="50" cy="51" rx="42" ry="40" fill="url(#lc-aura-64)" filter="url(#lc-blur-64)" />
    <ellipse class="living-core__body" cx="50" cy="51" rx="37" ry="35" fill="url(#lc-body-64)" filter="url(#lc-body-64-blur)" />
    <g clip-path="url(#lc-clip-64)" class="living-core__dust">
      <circle class="living-core__mote" style="animation-delay:0.00s;animation-duration:3.60s" cx="42" cy="46" r="1.1" fill="#EAF4FF" />
      <circle class="living-core__mote" style="animation-delay:0.35s;animation-duration:4.00s" cx="50" cy="40" r="1.3" fill="#EAF4FF" />
      <circle class="living-core__mote" style="animation-delay:0.70s;animation-duration:4.40s" cx="34" cy="40" r="1.2" fill="#EAF4FF" />
      <circle class="living-core__mote" style="animation-delay:1.05s;animation-duration:4.80s" cx="48" cy="56" r="1.4" fill="#EAF4FF" />
      <circle class="living-core__mote" style="animation-delay:1.40s;animation-duration:5.20s" cx="60" cy="48" r="1.1" fill="#EAF4FF" />
      <circle class="living-core__mote" style="animation-delay:1.75s;animation-duration:3.60s" cx="36" cy="54" r="1" fill="#EAF4FF" />
      <circle class="living-core__mote" style="animation-delay:2.10s;animation-duration:4.00s" cx="55" cy="30" r="1.2" fill="#EAF4FF" />
      <circle class="living-core__mote" style="animation-delay:0.00s;animation-duration:4.40s" cx="28" cy="48" r="1" fill="#EAF4FF" />
      <circle class="living-core__mote" style="animation-delay:0.35s;animation-duration:4.80s" cx="62" cy="34" r="1" fill="#EAF4FF" />
      <circle class="living-core__mote" style="animation-delay:0.70s;animation-duration:5.20s" cx="44" cy="66" r="1.2" fill="#EAF4FF" />
      <circle class="living-core__mote" style="animation-delay:1.05s;animation-duration:3.60s" cx="66" cy="58" r="0.9" fill="#EAF4FF" />
      <circle class="living-core__mote" style="animation-delay:1.40s;animation-duration:4.00s" cx="24" cy="58" r="1" fill="#EAF4FF" />
      <circle class="living-core__mote" style="animation-delay:1.75s;animation-duration:4.40s" cx="54" cy="68" r="0.9" fill="#EAF4FF" />
      <circle class="living-core__mote" style="animation-delay:2.10s;animation-duration:4.80s" cx="70" cy="44" r="0.8" fill="#EAF4FF" />
    </g>
    <ellipse class="living-core__orbit living-core__orbit--1" cx="50" cy="51" rx="52" ry="43" stroke="rgba(255,255,255,0.85)" stroke-width="0.9" />
    <ellipse class="living-core__orbit living-core__orbit--2" cx="50" cy="51" rx="47" ry="39" stroke="rgba(224,244,255,0.75)" stroke-width="0.8" />
    <circle class="living-core__core-glow" cx="48" cy="49" r="17" fill="url(#lc-core-64)" />
    <circle class="living-core__core" cx="48" cy="49" r="6.5" fill="#FFFFFF" />
  </g>
</svg>
