<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký — VDAI Academy</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="assets/css/styles.css?v=20260620">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #F8FAFC 0%, #EEF4FF 100%);
      padding: 24px;
    }
    .auth-card {
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(15,23,42,0.12);
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
    }
    .auth-logo {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none; margin-bottom: 32px;
    }
    .auth-logo-mark {
      width: 40px; height: 40px; border-radius: 10px;
      background: linear-gradient(135deg, #2563EB, #6D5DFB);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 900; font-size: 1rem;
    }
    .auth-logo-text { font-weight: 800; font-size: 1.1rem; color: #0F172A; }
    .auth-logo-text span { color: #2563EB; }
    .auth-title { font-size: 1.5rem; font-weight: 800; color: #0F172A; margin-bottom: 6px; }
    .auth-sub { font-size: 0.9rem; color: #64748B; margin-bottom: 28px; }
    .auth-field { margin-bottom: 16px; }
    .auth-field label { display: block; font-size: 0.875rem; font-weight: 600; color: #334155; margin-bottom: 6px; }
    .auth-field input {
      width: 100%; padding: 12px 14px; border: 1.5px solid #E2E8F0;
      border-radius: 10px; font-size: 1rem; color: #0F172A;
      transition: border-color 0.2s; outline: none; font-family: inherit;
      box-sizing: border-box;
    }
    .auth-field input:focus { border-color: #2563EB; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    .auth-btn {
      width: 100%; padding: 14px; border: none; border-radius: 10px;
      background: linear-gradient(135deg, #2563EB, #1D4ED8);
      color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer;
      margin-top: 8px; transition: opacity 0.2s, transform 0.2s;
      font-family: inherit;
    }
    .auth-btn:hover { opacity: 0.92; transform: translateY(-1px); }
    .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .auth-switch { text-align: center; font-size: 0.875rem; color: #475569; margin-top: 20px; }
    .auth-switch a { color: #2563EB; font-weight: 600; text-decoration: none; }
    .auth-switch a:hover { color: #1D4ED8; }
    .auth-msg { padding: 12px 14px; border-radius: 10px; font-size: 0.875rem; margin-bottom: 16px; display: none; }
    .auth-msg.error { background: #FEF2F2; color: #DC2626; border: 1px solid #FECACA; display: block; }
    .auth-msg.success { background: #F0FDF4; color: #15803D; border: 1px solid #BBF7D0; display: block; }
    .auth-back { display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; color: #64748B; text-decoration: none; margin-bottom: 20px; }
    .auth-back:hover { color: #2563EB; }
    .auth-perks { background: #F0F7FF; border-radius: 12px; padding: 14px 16px; margin-bottom: 24px; }
    .auth-perks p { font-size: 0.8rem; color: #1E40AF; font-weight: 600; margin: 0 0 8px; }
    .auth-perks ul { margin: 0; padding-left: 16px; }
    .auth-perks li { font-size: 0.8rem; color: #1E3A8A; line-height: 1.6; }
    @media (max-width: 480px) {
      .auth-card { padding: 32px 20px; }
    }
  </style>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <a href="index.html" class="auth-back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      Về trang chủ
    </a>
    <a href="index.html" class="auth-logo" style="display:inline-flex;align-items:center;text-decoration:none">
      <svg width="48" height="48" viewBox="0 0 32 32" fill="none" style="display:inline-block;flex-shrink:0"><path d="M3 5L16 28L29 5H23L16 18L9 5Z" fill="#2563EB"/><circle cx="27" cy="7.5" r="3" fill="#F97316"/></svg><span style="display:inline-flex;flex-direction:column;line-height:1;margin-left:10px"><b style="font-size:22px;font-weight:800;color:#fff;letter-spacing:2px;font-family:Inter,system-ui,sans-serif">VDAI</b><small style="font-size:10px;font-weight:600;color:#94a3b8;letter-spacing:4px;font-family:Inter,system-ui,sans-serif">ACADEMY</small></span>
    </a>
    <h1 class="auth-title">Đăng ký miễn phí</h1>
    <p class="auth-sub">Tạo tài khoản để nhận tài liệu & khoá học</p>

    <div class="auth-perks">
      <p>Thành viên được nhận:</p>
      <ul>
        <li>Bản đồ Affiliate AI miễn phí</li>
        <li>Tài liệu & mini-course miễn phí</li>
        <li>Ưu tiên thông báo khai giảng VDAI SOLO & SCALE</li>
      </ul>
    </div>

    <!-- Google OAuth -->
    <button type="button" id="googleBtn" style="width:100%;padding:12px;border:1.5px solid #E2E8F0;border-radius:10px;background:#fff;font-size:0.95rem;font-weight:600;color:#0F172A;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;font-family:inherit;transition:all 0.2s;margin-bottom:16px">
      <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 7.9 2.9l5.7-5.7C34.5 6.5 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19.1 12 24 12c3.1 0 5.8 1.1 7.9 2.9l5.7-5.7C34.5 6.5 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-1.9 13.5-5.1l-6.2-5.2C29.4 35.5 26.8 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.6 39.5 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.3 5.6l6.2 5.2C42 35.8 44 30.3 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
      Đăng ký bằng Google
    </button>

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <div style="flex:1;height:1px;background:#E2E8F0"></div>
      <span style="font-size:0.78rem;color:#94A3B8;font-weight:600">HOẶC</span>
      <div style="flex:1;height:1px;background:#E2E8F0"></div>
    </div>

    <div class="auth-msg" id="authMsg"></div>

    <form id="registerForm">
      <div class="auth-field">
        <label for="regName">Họ và tên</label>
        <input type="text" id="regName" placeholder="Nguyễn Văn A" required autocomplete="name">
      </div>
      <div class="auth-field">
        <label for="regEmail">Email</label>
        <input type="email" id="regEmail" placeholder="email@example.com" required autocomplete="email">
      </div>
      <div class="auth-field">
        <label for="regPassword">Mật khẩu</label>
        <input type="password" id="regPassword" placeholder="Tối thiểu 8 ký tự" required autocomplete="new-password" minlength="8">
      </div>
      <button type="submit" class="auth-btn" id="registerBtn">Tạo tài khoản miễn phí</button>
    </form>

    <div class="auth-switch">
      Đã có tài khoản? <a href="login.html">Đăng nhập</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/js/supabase-config.js"></script>
<script>
(async () => {
  const session = await getSession();
  if (session) {
    window.location.href = 'portal.html';
    return;
  }

  // Google OAuth
  document.getElementById('googleBtn').addEventListener('click', async () => {
    const { error } = await _supabase.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin + '/portal.html' }
    });
    if (error) {
      const msg = document.getElementById('authMsg');
      msg.className = 'auth-msg error';
      msg.textContent = 'Lỗi đăng nhập Google: ' + error.message;
    }
  });

  // Điền sẵn thông tin từ quiz
  const params = new URLSearchParams(window.location.search);
  if (params.get('email')) document.getElementById('regEmail').value = params.get('email');
  if (params.get('name'))  document.getElementById('regName').value  = params.get('name');

  // Ghi nhận mã giới thiệu (?ref=XXXXXXXX) — lưu vào sessionStorage để giữ qua các bước
  if (params.get('ref')) sessionStorage.setItem('vdai_ref', params.get('ref'));
  const referredBy = sessionStorage.getItem('vdai_ref') || '';

  const form = document.getElementById('registerForm');
  const msg  = document.getElementById('authMsg');
  const btn  = document.getElementById('registerBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = 'Đang tạo tài khoản...';
    msg.className = 'auth-msg';

    const name     = document.getElementById('regName').value.trim();
    const email    = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;

    const { error } = await signUp(email, password, { full_name: name, referred_by: referredBy || null });
    if (error) {
      msg.className = 'auth-msg error';
      msg.textContent = error.message === 'User already registered'
        ? 'Email này đã được đăng ký. Hãy đăng nhập.' : error.message;
      btn.disabled = false;
      btn.textContent = 'Tạo tài khoản miễn phí';
    } else {
      // Đăng ký xong → tự đăng nhập luôn → vào portal
      msg.className = 'auth-msg success';
      msg.textContent = 'Tạo tài khoản thành công! Đang vào trang tài liệu...';
      btn.textContent = 'Đang chuyển...';
      const { error: loginErr } = await signIn(email, password);
      if (loginErr) {
        // Nếu auto-login lỗi → chuyển sang login.html
        setTimeout(() => { window.location.href = 'login.html'; }, 1000);
      } else {
        setTimeout(() => { window.location.href = 'portal.html'; }, 800);
      }
    }
  });
})();
</script>
</body>
</html>
